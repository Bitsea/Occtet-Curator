name: Build Projects and Publish Docker Images

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  # Build occtet-nats Maven modules once
  build-nats:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Set up Maven
        uses: stCarolas/setup-maven@d6af6abeda15e98926a57b5aa970a96bb37f97d1
        with:
          maven-version: "3.9.11"

      - name: Configure Maven settings for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>\${env.GITHUB_ACTOR}</username>
                <password>\${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build all occtet-nats modules
        run: |
          cd occtet-nats
          mvn clean package -DskipTests

      - name: Publish to GitHub Packages
        run: |
          cd occtet-nats
          mvn deploy -DskipTests -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload occtet-nats artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: occtet-nats-artifacts
          path: occtet-nats/
          retention-days: 1

  # Build occtet-frontend Gradle project once
  build-frontend:
    runs-on: ubuntu-latest
    needs: [build-nats]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Make gradlew executable
        run: chmod +x occtet-frontend/gradlew

      - name: Build with Gradle
        run: |
          cd occtet-frontend
          ./gradlew -Pvaadin.productionMode=true bootJar --refresh-dependencies \
            -PgithubUsername=${{ github.actor }} \
            -PgithubToken=${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Upload occtet-frontend artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: occtet-frontend-artifacts
          path: occtet-frontend/build/libs/*.jar
          retention-days: 1

  # Build and push Docker images
  build-and-push:
    runs-on: ubuntu-latest
    needs: [build-nats, build-frontend]
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          # Frontend service
          - name: occtet-frontend
            context: ./occtet-frontend
            dockerfile: ./occtet-frontend/Dockerfile
            artifact: occtet-frontend-artifacts
          # NATS services
          - name: occtet-nats-ai-copyrightfilter-service
            context: ./occtet-nats/occtet-nats-ai-copyrightfilter-service
            dockerfile: ./occtet-nats/occtet-nats-ai-copyrightfilter-service/Dockerfile
            artifact: occtet-nats-artifacts
          - name: occtet-nats-ai-licensematcher-service
            context: ./occtet-nats/occtet-nats-ai-licensematcher-service
            dockerfile: ./occtet-nats/occtet-nats-ai-licensematcher-service/Dockerfile
            artifact: occtet-nats-artifacts
          - name: occtet-nats-copyrightfilter-service
            context: ./occtet-nats/occtet-nats-copyrightfilter-service
            dockerfile: ./occtet-nats/occtet-nats-copyrightfilter-service/Dockerfile
            artifact: occtet-nats-artifacts
          - name: occtet-nats-foss-report-service
            context: ./occtet-nats/occtet-nats-foss-report-service
            dockerfile: ./occtet-nats/occtet-nats-foss-report-service/Dockerfile
            artifact: occtet-nats-artifacts
          - name: occtet-nats-licensematcher-service
            context: ./occtet-nats/occtet-nats-licensematcher-service
            dockerfile: ./occtet-nats/occtet-nats-licensematcher-service/Dockerfile
            artifact: occtet-nats-artifacts
          - name: occtet-nats-spdx-service
            context: ./occtet-nats/occtet-nats-spdx-service
            dockerfile: ./occtet-nats/occtet-nats-spdx-service/Dockerfile
            artifact: occtet-nats-artifacts
          - name: occtet-nats-template
            context: ./occtet-nats/occtet-nats-template
            dockerfile: ./occtet-nats/occtet-nats-template/Dockerfile
            artifact: occtet-nats-artifacts
          - name: occtet-nats-vulnerability-service
            context: ./occtet-nats/occtet-nats-vulnerability-service
            dockerfile: ./occtet-nats/occtet-nats-vulnerability-service/Dockerfile
            artifact: occtet-nats-artifacts
          - name: occtet-nats-download-service
            context: ./occtet-nats/occtet-nats-download-service
            dockerfile: ./occtet-nats/occtet-nats-download-service/Dockerfile
            artifact: occtet-nats-artifacts
          - name: occtet-nats-ort-run-start-service
            context: ./occtet-nats/occtet-nats-ort-run-start-service
            dockerfile: ./occtet-nats/occtet-nats-ort-run-start-service/Dockerfile
            artifact: occtet-nats-artifacts
          - name: occtet-nats-process-run-service
            context: ./occtet-nats/occtet-nats-process-run-service
            dockerfile: ./occtet-nats/occtet-nats-process-run-service/Dockerfile
            artifact: occtet-nats-artifacts
          - name: occtet-nats-spdx-export-service
            context: ./occtet-nats/occtet-nats-spdx-export-service
            dockerfile: ./occtet-nats/occtet-nats-spdx-export-service/Dockerfile
            artifact: occtet-nats-artifacts
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Download occtet-frontend artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: occtet-frontend-artifacts
          path: ./occtet-frontend/build/libs

      - name: Download occtet-nats artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: occtet-nats-artifacts
          path: occtet-nats

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}_
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Debug - Show build context
        run: |
          echo "=== Build context: ${{ matrix.context }} ==="
          ls -la ${{ matrix.context }}/ || echo "Context not found"
          echo "=== Looking for JARs in context ==="
          find ${{ matrix.context }} -name "*.jar" -type f || echo "No JARs found"

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # push: ${{ github.event_name != 'pull_request' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image digest
        run: echo "Image published at ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.name }}"
